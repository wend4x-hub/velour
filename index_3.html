<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Velour</title>
<meta name="description" content="Онлайн-запись в ателье маникюра и бровей Velour">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --ground:#F2F1EE;
  --panel:#FFFFFF;
  --raise:#E7E5E0;
  --pearl:#1D1C1A;
  --mauve:#66625B;
  --mute:#8F8A82;
  --gold:#7E6C57;
  --solid:#1D1C1A;
  --on-solid:#F7F6F3;
  --line:rgba(29,28,26,.10);
  --line-2:rgba(29,28,26,.24);
  --ok:#3F7250;
  --bad:#B04A3A;
  --glass:rgba(242,241,238,.92);
  --sheen:rgba(255,255,255,.9);
  --bubble:#FFFFFF;
  --ikb:rgba(29,28,26,.07);
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#171716; --panel:#201F1D; --raise:#2B2A27; --pearl:#F0EEEA; --mauve:#ABA69E; --mute:#7C776F;
    --gold:#C8B69C; --solid:#F0EEEA; --on-solid:#171716; --line:rgba(240,238,234,.10); --line-2:rgba(240,238,234,.24);
    --ok:#8FC39F; --bad:#E39A8C; --glass:rgba(23,23,22,.92); --sheen:rgba(60,58,54,.55); --bubble:#262523; --ikb:rgba(240,238,234,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#171716; --panel:#201F1D; --raise:#2B2A27; --pearl:#F0EEEA; --mauve:#ABA69E; --mute:#7C776F;
  --gold:#C8B69C; --solid:#F0EEEA; --on-solid:#171716; --line:rgba(240,238,234,.10); --line-2:rgba(240,238,234,.24);
  --ok:#8FC39F; --bad:#E39A8C; --glass:rgba(23,23,22,.92); --sheen:rgba(60,58,54,.55); --bubble:#262523; --ikb:rgba(240,238,234,.08);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--ground)}
body{min-height:100vh;overflow-x:hidden;color:var(--pearl);font-family:var(--sans);font-size:16px;line-height:1.45;
  background:radial-gradient(120% 45% at 90% -8%, var(--sheen) 0%, transparent 62%) no-repeat, var(--ground)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--solid);outline-offset:3px;border-radius:6px}
::placeholder{color:var(--mute)}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(110px + var(--sb))}

/* ---------- главная ---------- */
.hero{padding:30px 20px 0}
.mono{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line-2);
  font-family:var(--serif);font-style:italic;font-size:24px;color:var(--gold)}
.word{font-family:var(--serif);font-weight:500;font-size:84px;line-height:.9;letter-spacing:.005em;margin-top:30px;
  animation:settle 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes settle{from{letter-spacing:.16em;opacity:0}to{letter-spacing:.005em;opacity:1}}
.tag{color:var(--mauve);margin-top:14px;max-width:32ch;font-size:15px}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:18px;font-size:14px;color:var(--mauve)}
.facts b{color:var(--pearl);font-weight:600}

.next{display:flex;align-items:center;gap:16px;width:calc(100% - 40px);margin:28px 20px 0;padding:18px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.next .k{font-size:13px;color:var(--mauve)}
.next .v{font-family:var(--serif);font-size:30px;line-height:1.05;color:var(--gold);margin-top:2px}
.next .s{font-size:14px;color:var(--mauve);margin-top:2px}
.pill-o{margin-left:auto;flex:none;border:1px solid var(--solid);color:var(--pearl);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px}

.sec{padding:40px 20px 0}
.h2{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1}
.ctabs{display:flex;gap:24px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ct{padding:10px 0 12px;color:var(--mauve);font-weight:500;white-space:nowrap;position:relative}
.ct[aria-selected="true"]{color:var(--pearl)}
.ct[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--solid)}
.svc{display:flex;gap:16px;align-items:flex-start;width:100%;padding:18px 0;border-bottom:1px solid var(--line)}
.svc .n{font-weight:600;font-size:16px}
.svc .d{font-size:14px;color:var(--mauve);margin-top:3px}
.svc .t{font-size:13px;color:var(--mute);margin-top:6px}
.svc .p{margin-left:auto;flex:none;text-align:right;font-family:var(--serif);font-size:23px;line-height:1.1;white-space:nowrap}
.svc .p small{display:block;font-family:var(--sans);font-size:12px;color:var(--mute);line-height:1.4}

.team{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin:18px -20px 0;padding:0 20px 4px}
.team::-webkit-scrollbar{display:none}
.tm{flex:none;width:92px;text-align:center}
.tm .ava{margin:0 auto}
.tm .n{font-weight:600;font-size:14px;margin-top:10px}
.tm .l{font-size:12px;color:var(--mauve);margin-top:1px}

.info{margin-top:16px;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
.info dt,.info dd{padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.info dt{color:var(--mauve);padding-right:18px}
.info dd{text-align:right}

.ava{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--raise);
  box-shadow:inset 0 0 0 1px var(--line-2);font-family:var(--serif);font-size:26px;color:var(--gold)}

/* ---------- шаги записи ---------- */
.bar{position:sticky;top:var(--st);z-index:5;padding:14px 20px 0;background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar .r{display:flex;align-items:center;gap:14px}
.back{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.bar .ti{font-family:var(--serif);font-size:27px;line-height:1.05}
.bar .st{font-size:13px;color:var(--mauve)}
.prog{height:1px;background:var(--line);margin-top:14px;position:relative}
.prog i{position:absolute;left:0;top:-.5px;height:2px;background:var(--solid);transition:width .35s ease}
.sum{display:flex;justify-content:space-between;gap:16px;padding:16px 20px 0;font-size:14px;color:var(--mauve)}
.sum b{color:var(--pearl);font-weight:600}

.ms{padding:6px 20px 0}
.m{display:flex;gap:16px;align-items:center;width:100%;padding:16px 0;border-bottom:1px solid var(--line)}
.m[aria-pressed="true"] .ava{background:var(--solid);color:var(--on-solid);box-shadow:none}
.m .n{font-weight:600}
.m .l{font-size:14px;color:var(--mauve);margin-top:1px}
.m .f{font-size:13px;color:var(--ok);margin-top:5px}
.m .f.no{color:var(--mute)}
.m .pr{margin-left:auto;flex:none;font-family:var(--serif);font-size:22px;white-space:nowrap}

.month{padding:18px 20px 0;font-size:14px;color:var(--mauve)}
.days{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 20px 4px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;padding:9px 0 11px;border-radius:26px;text-align:center}
.day .w{font-size:12px;color:var(--mauve)}
.day .n{font-family:var(--serif);font-size:27px;line-height:1.1}
.day.off,.day.off .w{color:var(--mute)}
.day[aria-pressed="true"]{background:var(--solid);color:var(--on-solid)}
.day[aria-pressed="true"] .w{color:var(--on-solid);opacity:.7}
.slots{padding:0 20px}
.slots h3{font-size:13px;font-weight:600;color:var(--mauve);margin:20px 0 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:12px 0;border-radius:999px;text-align:center;box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--solid);color:var(--on-solid);box-shadow:none}
.empty{margin:30px 20px 0;padding:26px 20px;text-align:center;color:var(--mauve);box-shadow:inset 0 0 0 1px var(--line);border-radius:4px}
.empty b{display:block;font-family:var(--serif);font-weight:500;font-size:24px;color:var(--pearl);margin-bottom:6px}
.empty button{margin-top:14px;color:var(--gold);font-weight:600}

/* приглашение — главный акцент */
.card{position:relative;margin:20px 20px 0;padding:28px 24px 22px;background:var(--panel);border-radius:3px;text-align:center;
  box-shadow:inset 0 0 0 1px var(--line-2), 0 24px 48px -30px rgba(0,0,0,.35)}
.card::before{content:"";position:absolute;inset:6px;border:1px solid var(--line-2);border-radius:1px;pointer-events:none}
.card .k{font-size:13px;color:var(--mauve)}
.card .big{font-family:var(--serif);font-weight:500;font-size:68px;line-height:1;color:var(--gold);margin-top:8px}
.card .date{font-family:var(--serif);font-size:23px;margin-top:6px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);text-align:left;font-size:15px}
.card dt{color:var(--mauve)}
.card dd{text-align:right}
.card dd.tot{font-family:var(--serif);font-size:24px;line-height:1.1}

.form{display:grid;gap:22px;padding:26px 20px 0}
.f label{display:block;font-size:13px;color:var(--mauve)}
.f input,.f textarea{display:block;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-2);border-radius:0;
  padding:10px 0;font-size:17px;outline:none;transition:border-color .15s}
.f input:focus,.f textarea:focus{border-bottom-color:var(--solid)}
.f textarea{resize:none;height:64px}
.f .err{display:none;color:var(--bad);font-size:13px;margin-top:6px}
.f.bad input{border-bottom-color:var(--bad)}
.f.bad .err{display:block}
.link{color:var(--gold);font-weight:600;font-size:14px;margin-top:10px}
.note{font-size:13px;color:var(--mute);padding:18px 20px 0}

.cta{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:16px 20px calc(14px + var(--sb));
  background:linear-gradient(to top,var(--ground) 62%,transparent)}
.cta button{display:block;width:100%;max-width:440px;margin:0 auto;padding:17px;border-radius:999px;background:var(--solid);color:var(--on-solid);
  text-align:center;font-weight:700;font-size:16px;transition:opacity .15s,transform .1s}
.cta button:active{transform:scale(.985)}
.cta button:disabled{opacity:.35}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--sb)}
.tabbar nav{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 11px;font-size:12px;font-weight:500;color:var(--mute);position:relative}
.tab[aria-current="page"]{color:var(--pearl)}
.tab .badge{position:absolute;top:6px;left:calc(50% + 9px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--solid);color:var(--on-solid);font-size:11px;font-weight:700;display:grid;place-items:center}

/* готово */
.done{padding:40px 20px 0;text-align:center}
.done h1{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1}
.done p{color:var(--mauve);margin:10px auto 0;max-width:32ch;font-size:15px}
.acts2{display:grid;gap:10px;padding:22px 20px 0}
.ghost{padding:15px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-2);text-align:center;font-weight:600}

/* превью сообщения бота */
.chatp{margin:30px 20px 0}
.chatp .cap{font-size:13px;color:var(--mute);margin-bottom:10px}
.bub{background:var(--bubble);box-shadow:0 1px 2px var(--line);border-radius:16px 16px 16px 5px;padding:10px 13px 8px;font-size:14.5px;white-space:pre-line;max-width:92%;position:relative}
.bub .bt{display:block;text-align:right;font-size:11px;color:var(--mute);margin-top:2px}
.ikb{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;margin-top:5px;max-width:92%}
.ikb span{background:var(--ikb);border-radius:9px;padding:9px 6px;text-align:center;font-size:13.5px;font-weight:600}

/* мои записи */
.ph{padding:30px 20px 0}
.ph h1{font-family:var(--serif);font-weight:500;font-size:42px;line-height:1}
.ph p{color:var(--mauve);margin-top:8px;font-size:15px}
.bk{display:flex;gap:18px;margin:0 20px;padding:18px 0;border-bottom:1px solid var(--line)}
.bk:first-of-type{margin-top:14px;border-top:1px solid var(--line)}
.bk .dd{width:54px;flex:none;text-align:center}
.bk .dd .n{font-family:var(--serif);font-size:38px;line-height:1;color:var(--gold)}
.bk .dd .m{font-size:12px;color:var(--mauve);margin-top:3px}
.bk .t{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.bk .s{margin-top:2px}
.bk .x{font-size:14px;color:var(--mauve);margin-top:2px}
.bk .row{display:flex;gap:20px;margin-top:10px;font-size:14px;font-weight:600;color:var(--gold)}
.bk.past{opacity:.5}
.bk.past .dd .n{color:var(--pearl)}

/* кабинет */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi div{padding:16px 0 14px}
.kpi div+div{padding-left:14px;border-left:1px solid var(--line)}
.kpi b{display:block;font-family:var(--serif);font-weight:500;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--mauve)}
.load{padding:18px 20px 0;display:grid;gap:12px}
.lr{display:grid;grid-template-columns:64px 1fr 40px;gap:12px;align-items:center;font-size:14px}
.lr .tr{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.lr .tr i{display:block;height:100%;background:var(--solid)}
.lr span:last-child{text-align:right;color:var(--mauve);font-variant-numeric:tabular-nums}
.sub{font-family:var(--serif);font-size:26px;padding:34px 20px 0}
.tl{margin:12px 20px 0;border-top:1px solid var(--line)}
.tl .it{display:grid;grid-template-columns:54px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.tl .h{font-weight:700;font-variant-numeric:tabular-nums}
.tl .w{font-weight:600}
.tl .q{font-size:14px;color:var(--mauve)}
.tl .pr{font-family:var(--serif);font-size:19px;white-space:nowrap}
.tag-n{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--solid);color:var(--on-solid);font-size:11px;font-weight:700;vertical-align:2px}
.tag-c{display:inline-block;margin-left:8px;font-size:12px;color:var(--ok);font-weight:600}

.loader{min-height:70vh;display:grid;place-items:center;text-align:center;padding:0 20px}
.loader b{display:block;font-family:var(--serif);font-weight:500;font-size:56px}
.loader span{color:var(--mauve);font-size:14px}
.loader button{margin-top:18px;color:var(--gold);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(110px + var(--sb));z-index:20;max-width:calc(100% - 40px);transform:translate(-50%,16px);
  background:var(--solid);color:var(--on-solid);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

.view{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.word{font-size:68px}.grid{grid-template-columns:repeat(3,1fr)}.card .big{font-size:56px}}
</style>
</head>

<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   Velour — мини-приложение записи для Telegram.

   API — адрес вашего Cloudflare Worker (см. README).
   Пока он пустой, приложение работает в демо-режиме: расписание
   выдуманное, записи хранятся только на этом устройстве.

const API = 'https://velour-bot.wend4x.workers.dev';

const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const LIVE = !!(API && inTG);

if (inTG){
  tg.ready(); tg.expand();
  const applyTheme = () => {
    const dark = tg.colorScheme === 'dark', bg = dark ? '#171716' : '#F2F1EE';

    try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); if (tg.setBottomBarColor) tg.setBottomBarColor(bg); } catch(e){}
  };
  applyTheme(); tg.onEvent('themeChanged', applyTheme);
}
const hap = {
  tap(){ try{ inTG && tg.HapticFeedback.selectionChanged(); }catch(e){} },
  ok(){ try{ inTG && tg.HapticFeedback.notificationOccurred('success'); }catch(e){} },
  err(){ try{ inTG && tg.HapticFeedback.notificationOccurred('error'); }catch(e){} }
};

/* Настройки салона. В рабочем режиме приходят с сервера — правьте их в worker.js. */
let CFG = {

    {id:'m4', cat:'Маникюр', name:'Спа-уход для рук', note:'Пилинг, парафин, массаж', dur:45, price:2400},
    {id:'p1', cat:'Педикюр', name:'Педикюр с покрытием', note:'Полная обработка стоп и пальцев', dur:120, price:4800},
    {id:'p2', cat:'Педикюр', name:'Экспресс-педикюр', note:'Пальцы, без покрытия', dur:60, price:2900},
    {id:'b1', cat:'Брови и ресницы', name:'Архитектура бровей', note:'Форма, коррекция, окрашивание', dur:60, price:2600},
    {id:'b2', cat:'Брови и ресницы', name:'Долговременная укладка', note:'С окрашиванием и уходом', dur:90, price:3400},
    {id:'b3', cat:'Брови и ресницы', name:'Ламинирование ресниц', note:'Изгиб, окрашивание, ботокс', dur:90, price:3600}
  ],
  masters:[
    {id:'anna',  name:'Анна Ветрова',   short:'Анна', dat: 'Анне', gen: 'Анны',  level:'Арт-директор', k:1.3,  cats:['Маникюр'], off:[1], rating:5.0, reviews:318},

const dayDate = i => { const n = salonNow(); return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + i)); };
const dayKey = i => dayDate(i).toISOString().slice(0,10);
const fromKey = k => new Date(k + 'T00:00:00Z');
const dayIdxOf = k => Math.round((fromKey(k) - dayDate(0)) / 864e5);
const fmt = (d, o) => d.toLocaleDateString('ru-RU', Object.assign({timeZone:'UTC'}, o));

function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }

function takenList(){
  return LIVE ? S.busy : S.my.filter(b => b.status === 'active');
}
function busy(mid, dayIdx, start, dur){
  const m = master(mid);
  if (!m || m.off.includes(dayDate(dayIdx).getUTCDay())) return true;
  const k = dayKey(dayIdx), end = start + dur;
  if (takenList().some(b => b.id !== S.resched && b.master === mid && b.day === k && start < b.start + b.dur && b.start < end)) return true;
  if (!LIVE) for (let t = start; t < end; t += CFG.step) if (hash(mid + k + t) < 0.3) return true; // демо: имитация занятости
  return false;
}
function slotsFor(s, mid, dayIdx){
  const out = [];
  const from = dayIdx === 0 ? Math.ceil((nowMin() + 60) / CFG.step) * CFG.step : CFG.open;
  const pool = mid === 'any' ? mastersFor(s) : [master(mid)];
  for (let t = Math.max(CFG.open, from); t + s.dur <= CFG.close; t += CFG.step){
    const free = pool.find(m => !busy(m.id, dayIdx, t, s.dur));
    if (free) out.push({t, master:free.id});
  }
  return out;
}
function nearest(s, mid){
  for (let d = 0; d < CFG.daysAhead; d++){ const x = slotsFor(s, mid, d)[0]; if (x) return {day:d, t:x.t, master:x.master}; }
  return null;
}

}

      <div class="pr">${rub(b.price)}</div></div>`).join('') : '<p class="note" style="padding:16px 0">Сегодня записей нет</p>'}</div>
  ${LIVE ? '' : `<div class="chatp"><div class="cap">Уведомление администратору в боте</div>
    <div class="bub"><b>Новая запись</b>

${last ? esc(last.name) + ', ' + esc(last.phone) : 'Ольга К., +7 (900) 123-45-67'}
${last ? esc(last.serviceName) + ' — ' + esc(master(last.master).short) : 'Маникюр с покрытием — Анна'}
${last ? cap(fmt(fromKey(last.day), {day:'numeric', month:'long'})) + ', ' + hm(last.start) : cap(dayLabel(1)) + ', 12:30'}
${last ? rub(last.price) : '4 900 ₽'}${last && last.comment ? '\nПожелание: ' + esc(last.comment) : ''}<span class="bt">${hm(nowMin())}</span></div>
    <div class="ikb"><span>Подтвердить</span><span>Контакт клиента</span></div></div>
  <p class="note">Запишитесь на вкладке «Запись», и заявка появится здесь.</p>`}`;
}

function viewLoader(){
  return `<div class="loader"><div><b>${esc(CFG.name)}</b>
    ${S.loadError ? `<span>${esc(S.loadError)}</span><br><button data-act="retry">Попробовать снова</button>` : '<span>Загружаем расписание</span>'}</div></div>`;
}

/* ---------------- отрисовка ---------------- */
function render(){
  let html = '', cta = '';
  const inFlow = S.tab === 'book' && FLOW.includes(S.step);
  if (S.loading) html = viewLoader();
  else if (S.tab === 'book'){
    if (S.step === 'home') html = viewHome();
    else if (S.step === 'master'){ html = viewMaster(); cta = `<button data-act="next" ${S.master ? '' : 'disabled'}>Выбрать время</button>`; }
    else if (S.step === 'time'){ html = viewTime(); cta = `<button data-act="next" ${S.time != null ? '' : 'disabled'}>${S.time != null ? cap(dayLabel(S.day)) + ', ' + hm(S.time) + ' — далее' : 'Выберите время'}</button>`; }
    else if (S.step === 'confirm'){ html = viewConfirm(); cta = `<button data-act="submit" ${S.sending ? 'disabled' : ''}>${S.sending ? 'Записываем…' : S.resched ? 'Перенести запись' : 'Записаться'}</button>`; }
    else html = viewDone();
  }
  else if (S.tab === 'mine') html = viewMine();
  else html = viewOwner();

  const active = S.my.filter(b => b.status === 'active' && !isPast(b)).length;
  const tabs = S.loading ? '' : `<div class="tabbar"><nav>
    <button class="tab" data-act="tab" data-v="book" ${S.tab === 'book' ? 'aria-current="page"' : ''}>${I.book}Запись</button>
    <button class="tab" data-act="tab" data-v="mine" ${S.tab === 'mine' ? 'aria-current="page"' : ''}>${I.mine}Мои записи${active ? `<span class="badge">${active}</span>` : ''}</button>
    ${S.isOwner ? `<button class="tab" data-act="tab" data-v="owner" ${S.tab === 'owner' ? 'aria-current="page"' : ''}>${I.owner}Кабинет</button>` : ''}
  </nav></div>`;

  $('#app').innerHTML = `<div class="view">${html}</div>` + (inFlow ? `<div class="cta">${cta}</div>` : tabs);

  if (S.tab === 'book' && S.step === 'time'){ const d = document.querySelector('.day[aria-pressed="true"]'); if (d) d.scrollIntoView({inline:'center', block:'nearest'}); }
  if (inTG){ (S.tab === 'book' && S.step !== 'home') ? tg.BackButton.show() : tg.BackButton.hide(); }
}

/* ---------------- форма ---------------- */
function saveForm(){
  const n = $('#name'), p = $('#phone'), c = $('#comment');
  if (n) S.name = n.value.trim();
  if (p) S.phone = p.value.trim();
  if (c) S.comment = c.value.trim();
}
function fmtPhone(v){
  let d = v.replace(/\D/g,'');
  if (d.startsWith('8')) d = '7' + d.slice(1);
  if (d && !d.startsWith('7')) d = '7' + d;
  d = d.slice(0,11);
  const p = [d.slice(1,4), d.slice(4,7), d.slice(7,9), d.slice(9,11)];
  let out = d ? '+7' : '';
  if (p[0]) out += ' (' + p[0] + (p[0].length === 3 ? ')' : '');
  if (p[1]) out += ' ' + p[1];
  if (p[2]) out += '-' + p[2];
  if (p[3]) out += '-' + p[3];
  return out;
}

async function submit(){
  saveForm();
  const okName = S.name.length > 0, okPhone = S.phone.replace(/\D/g,'').length === 11;
  $('#f-name').classList.toggle('bad', !okName);
  $('#f-phone').classList.toggle('bad', !okPhone);
  if (!okName || !okPhone){ hap.err(); (okName ? $('#phone') : $('#name')).focus(); return; }
  store.set('velour-me', {name:S.name, phone:S.phone});
  const wasResched = !!S.resched;
  const d = draft();

  if (LIVE){
    S.sending = true; render();
    try {
      const j = await api('/api/book', Object.assign({}, d, {name:S.name, phone:S.phone, comment:S.comment, rescheduleId:S.resched}));
      await refresh();
      S.lastId = j.booking.id;
    } catch(e){
      S.sending = false; hap.err();
      if (e.status === 409){ toast('Это время только что заняли. Выберите другое'); try { await refresh(); } catch(_){} S.time = null; go('time'); }
      else { toast(e.message); render(); }
      return;
    }
    S.sending = false;
  } else {
    if (busy(d.master, S.day, d.start, d.dur)){ hap.err(); toast('Это время только что заняли. Выберите другое'); S.time = null; go('time'); return; }
    if (S.resched){ const old = S.my.find(x => x.id === S.resched); if (old) old.status = 'moved'; }
    const b = Object.assign({}, d, {id:Date.now().toString(36), name:S.name, phone:S.phone, comment:S.comment, status:'active'});
    S.my.push(b); S.lastId = b.id; store.set('velour-demo', S.my);
  }
  hap.ok(); S.comment = ''; S.resched = wasResched ? 'done' : null;
  go('done');
  if (S.resched === 'done') S.resched = null;
}

async function cancelBooking(id){
  const b = S.my.find(x => x.id === id);
  if (LIVE){
    try { await api('/api/cancel', {id}); await refresh(); } catch(e){ hap.err(); toast(e.message); return; }
  } else { b.status = 'cancelled'; store.set('velour-demo', S.my); }
  hap.ok(); render(); toast('Запись отменена');
}

function startResched(id){
  const b = S.my.find(x => x.id === id && x.status === 'active');
  if (!b || !service(b.serviceId)) return false;
  S.resched = id; S.service = service(b.serviceId); S.master = b.master; S.time = null;
  const n = nearest(S.service, b.master); S.day = n ? n.day : Math.max(0, dayIdxOf(b.day));
  S.tab = 'book'; go('time');
  return true;
}
function startAgain(id){
  const b = S.my.find(x => x.id === id);
  if (!b || !service(b.serviceId)) return;
  S.resched = null; S.service = service(b.serviceId); S.master = b.master; S.time = null;
  const n = nearest(S.service, b.master); S.day = n ? n.day : 0;
  S.tab = 'book'; go('time');
}

/* ---------------- события ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch (a){
    case 'cat': hap.tap(); S.cat = v; render(); break;
    case 'service': hap.tap(); S.service = service(v); S.master = null; S.time = null; S.resched = null; go('master'); break;
    case 'quick': hap.tap(); S.service = CFG.services[0]; S.master = 'any'; S.day = +el.dataset.day; S.time = +el.dataset.t; S.slotMaster = el.dataset.m; S.resched = null; go('confirm'); break;
    case 'master': { hap.tap(); S.master = v; S.time = null; const n = nearest(S.service, v); S.day = n ? n.day : 0; render(); break; }
    case 'day': hap.tap(); S.day = +v; S.time = null; render(); break;
    case 'jump': { const n = nearest(S.service, S.master); if (n){ S.day = n.day; render(); } break; }
    case 'time': hap.tap(); S.time = +v; S.slotMaster = el.dataset.m; render(); break;
    case 'next': hap.tap(); go(S.step === 'master' ? 'time' : 'confirm'); break;
    case 'back': back(); break;
    case 'submit': submit(); break;
    case 'tab': setTab(v); break;
    case 'close': tg.close(); break;
    case 'retry': boot(); break;
    case 'resched': hap.tap(); startResched(v); break;
    case 'again': hap.tap(); startAgain(v); break;
    case 'cancel':
      if (el.dataset.sure) cancelBooking(v);
      else { hap.tap(); el.dataset.sure = '1'; el.textContent = 'Точно отменить?'; }
      break;
    case 'tgphone':
      tg.requestContact((ok, res) => {
        const ph = res && res.responseUnsafe && res.responseUnsafe.contact && res.responseUnsafe.contact.phone_number;
        if (ph){ saveForm(); S.phone = fmtPhone(ph); render(); }
        else if (ok) toast('Номер отправлен в чат с ботом');
      });
      break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'phone'){ e.target.value = fmtPhone(e.target.value); $('#f-phone').classList.remove('bad'); }
  if (e.target.id === 'name') $('#f-name').classList.remove('bad');
});
document.addEventListener('focusout', saveForm);
if (inTG) tg.BackButton.onClick(back);

/* ---------------- запуск ---------------- */
async function boot(){
  const q = new URLSearchParams(location.search);
  const reschedId = q.get('resched');
  if (LIVE){
    S.loading = true; S.loadError = null; render();
    try { await refresh(); S.loading = false; }
    catch(e){ S.loadError = e.status === 401 ? 'Откройте приложение из чата с ботом' : 'Не удалось загрузить расписание'; render(); return; }
  }
  render();
  if (reschedId && !startResched(reschedId)) toast('Эта запись уже неактивна');
}
boot();
</script>
</body>
